name: Setup PHP

description: Setup PHP and required tools

inputs:
  php-coverage:
    default: 'none'
    description: Coverage driver to use.
    required: false

  php-extensions:
    default: ''
    description: PHP extensions to install.
    required: false

  php-tools:
    default: 'cs2pr'
    description: PHP tools to install.
    required: false

  php-version:
    default: '8.5'
    description: The PHP version to use.
    required: false

  pie-extensions:
    default: ''
    description: Comma-separated PIE extension packages to install.
    required: false

runs:
  using: composite

  steps:
    - name: Prepare PHP tools
      id: php-tools
      env:
        PHP_TOOLS: ${{ inputs.php-tools }}
        PIE_EXTENSIONS: ${{ inputs.pie-extensions }}
      run: |
        tools="$PHP_TOOLS"

        if [[ -n "$PIE_EXTENSIONS" ]]; then
          if [[ -z "$tools" || "$tools" == "none" ]]; then
            tools="pie"
          else
            tools="$tools, pie"
          fi
        fi

        echo "tools=$tools" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: ${{ inputs.php-coverage }}
        extensions: ${{ inputs.php-extensions }}
        php-version: ${{ inputs.php-version }}
        tools: ${{ steps.php-tools.outputs.tools }}

    - name: Install PIE extensions
      if: ${{ inputs.pie-extensions != '' }}
      env:
        PIE_EXTENSIONS: ${{ inputs.pie-extensions }}
      run: |
        IFS=',' read -ra extensions <<< "$PIE_EXTENSIONS"

        for extension in "${extensions[@]}"; do
          extension="${extension#"${extension%%[![:space:]]*}"}"
          extension="${extension%"${extension##*[![:space:]]}"}"

          if [[ -n "$extension" ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              pie install --no-cache "$extension"
            else
              sudo -E pie install --no-cache "$extension"
            fi
          fi
        done
      shell: bash
