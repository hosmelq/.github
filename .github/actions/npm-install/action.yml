name: Install JS dependencies

description: Install JavaScript dependencies with Nub

inputs:
  node-version:
    default: '24'
    description: The Node.js version to use.
    required: false

  nub-version:
    default: 'latest'
    description: The Nub version to install.
    required: false

  working-directory:
    default: '.'
    description: Directory to run package manager commands in.
    required: false

runs:
  using: composite

  steps:
    - name: Install Nub
      uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
      with:
        node-version: ${{ inputs.node-version }}
        nub-version: ${{ inputs.nub-version }}
        working-directory: ${{ inputs.working-directory }}

    - name: Install dependencies
      run: nub ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
